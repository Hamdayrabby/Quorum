# Agent Wars base theme. All typography and component styling lives in
# ui/theme.py; this file only pins the palette so native widgets match.
[theme]
base = "dark"
primaryColor = "#5B9DFF"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#151C27"
textColor = "#E8EDF5"

[browser]
gatherUsageStats = false

# NOTE: Streamlit 1.66 has no initialSidebarState option (config warning if
# set). The sidebar's visible-by-default behavior comes from the theme's
# header CSS (expand arrow kept clickable) in ui/theme.py.
