# Agent Wars base theme. All typography and component styling lives in
# ui/theme.py; this file only pins the palette so native widgets match.
[theme]
base = "dark"
primaryColor = "#5B9DFF"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#151C27"
textColor = "#E8EDF5"

[browser]
gatherUsageStats = false

# The sidebar hosts the per-agent Settings panel — it must be reachable
# without hunting for the (glitchy) expand control.
[client]
initialSidebarState = "expanded"
